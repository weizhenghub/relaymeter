<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>悬浮球</title>
    <!-- v0.180：悬浮球 + 实时侧栏合并成单窗口的渲染层。
         单一 pywebview 透明窗口同时承载「球帽 + 实时面板」两种形态：
           * 收起态 = 纯球（窗口 = ball_size 方），面板隐藏，球区真透桌面。
           * 展开态 = 球方留在左上 + 右侧实时面板（窗口向右+上下延展成整高面板）。
        布局：body 是 flex.row（复用 live_panel.html 的 .live-panel-body 结构），
        左 #ghost-cap（固定 ball_size 方，透明 SVG 幽灵），右 #ghost-panel-surface
        （实底，防键控孔洞）。
        透明：html/body background transparent + 窗体 BackColor=TransparencyKey=
        #010203（BallLayer2 在 events.loaded + sleep(2) 后设）→ 球区露出窗体键控色
        被键空 → 真透；面板区实底（--root-bg，非键控色）→ 不透明无孔洞。 -->
    <script>
      try {
        var m = location.hash.match(/[#&]theme=([^&]+)/);
        if (m) document.documentElement.setAttribute("data-theme", decodeURIComponent(m[1]));
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles-20260817.css?v=20260902-69" />
    <link rel="stylesheet" href="live_panel.css?v=20260902-37" />
    <style>
      /* v0.180：单窗布局覆盖。html 保持透明（球区要键空），只在面板 surface 实底。 */
      html {
        background: transparent !important;
      }
      /* v0.196：展开侧栏时，去掉 surface 上两块 .bg-glow 光晕（左上/右下
         radial 大圆 + blur），换成纯色 --root-bg —— 否则球帽与面板交界处
         会残留一条由深到浅的渐变透明条。侧栏本体背景不变，仍为 --root-bg。 */
      #ghost-panel-surface .bg-glow { display: none; }
      #ghost-root {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        width: 100%;
        height: 100vh;
      }
      /* v0.205：引导带 —— 教程阶段容器左扩的占位带，球帽被推到带右侧。
         宽度由 Python 侧 set_tour_guide_width 驱动（data-tour-guide 属性），
         教程结束归 0 即还原（宽度 0 的 flex 子不占空间）。
         v0.207：带**保持全透明**（裸悬浮卡片的要求 —— 不加任何背景）。
         此前「灰底蔓延到侧栏外」的根因已查明：demo 行/高亮框错用主窗
         tour-breathe 动画（box-shadow 0 0 0 9999px 全屏灰），与带无关，
         已改局部呼吸（见 live_panel.css）。 */
      #tour-guide-band {
        flex: 0 0 0;
        width: 0;
        height: 100vh;
        background: transparent;
      }
      #tour-guide-band[data-tour-guide="1"] {
        flex: 0 0 var(--tour-guide-w, 300px);
        width: var(--tour-guide-w, 300px);
        background: transparent;
      }
      /* 球帽方区：恒 ball_size 方，透明（无底色，露出窗体 #010203 键空）。 */
      #ghost-cap {
        flex: 0 0 var(--ball-size, 56px);
        width: var(--ball-size, 56px);
        height: var(--ball-size, 56px);
        position: relative;
        background: transparent;
        flex-shrink: 0;
      }
      #cap-ball {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      /* 面板 surface：右侧实底，防键控孔洞（键控色 #010203 会键空任何等于它的像素）。 */
      #ghost-panel-surface {
        flex: 1 1 auto;
        min-width: 0;
        height: 100vh;
        background: var(--root-bg);
        position: relative;
      }
      /* 收起态：面板隐藏，球帽占满整窗（窗口 = ball_size 方）。 */
      body.collapsed #ghost-panel-surface { display: none; }
      body.collapsed #ghost-cap { flex: 0 0 100%; width: 100%; height: 100%; }
      body.collapsed #ghost-root { height: 100%; }
      /* 展开态：球帽方留在左上，面板占满剩余（右侧 + 整高）。 */
      body:not(.collapsed) #ghost-cap { align-self: flex-start; }
      /* v0.208：教程收起演示态 —— 只隐藏面板 surface，**球帽保持 56px 不占满**
         （不用 body.collapsed 的 width:100%，避免球帽被拉成整窗大球 → 展开时
         "球先变大再展开"）。窗口几何由 Python 缩到「引导带+球帽」，指引卡留在
         透明引导带内可见。 */
      body.tour-collapsed #ghost-panel-surface { display: none; }
      body.tour-collapsed #ghost-cap { align-self: flex-start; }

      /* v0.184：展开态顶栏拖拽区 —— 侧栏 surface 顶部 32px，拖动整个容器窗口。 */
      #panel-drag-region {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 32px;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        /* v0.203：侧栏收缩时窗口从「球帽+侧栏」缩回 56px 球帽宽，surface
           flex 宽趋 0，但本区绝对定位不参与 flex 收缩 → 红叉按钮（right:
           6px 相对本区）会被挤到球帽区上，形成「收缩过程中悬浮球上短暂
           出现关闭按钮」。overflow:hidden 让本区随 surface 变窄时把超出的
           红叉裁掉 —— 球帽上再也不会露出关闭按钮。 */
        overflow: hidden;
      }
      #panel-drag-region:active { cursor: grabbing; }
      #panel-drag-region .win-ctrl-close { position: absolute; top: 4px; right: 6px; }
      /* v0.184：磁吸模式（关球）—— 球帽隐藏，side surface 自动占满整窗。 */
      body.no-ball #ghost-cap { display: none; }

      /* 幽灵状态 class（复刻 ghost_ball.html / GDI）。
         v0.184.2：S2（ghost-done）整球帽 180° 翻转——halo + body + ring +
         heart 全部一起反向。基点 50% 50%（viewBox 中心），加 400ms 过渡让
         翻转过程平滑；子元素的 keyframe 动画用各自 transform 组合（旋转
         嵌套在父元素里 = 父 transform * 子 transform，互不打架）。 */
      #cap-ball {
        transform-origin: 50% 50%;
        transition: transform 0.4s cubic-bezier(.4, .0, .2, 1);
      }
      #cap-ball.ghost-flow { animation: gp-bob 2.6s ease-in-out infinite; }
      @keyframes gp-bob {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-2.2%); }
      }
      #ghost-halo { opacity: 0; transform-origin: 50% 50%; }
      #cap-ball.ghost-flow #ghost-halo { opacity: 1; animation: gp-halo 2.2s ease-in-out infinite; }
      #cap-ball.ghost-done #ghost-halo { opacity: 1; animation: gp-halo 2.2s ease-in-out infinite; }
      @keyframes gp-halo {
        0%, 100% { transform: scale(1);   opacity: .55; }
        50%      { transform: scale(1.13); opacity: .9; }
      }
      /* v0.184.2：S2 整球帽旋转 180°（halo + body + ring + heart 一起反向）。
         父元素 transform 会嵌套到子元素 keyframe 里的 transform 上，所以
         halo/ring/heart 的 scale 仍然各自走自己的 keyframe，但视觉上是
         在已翻转 180° 的坐标系内继续缩放——观感正常。 */
      #cap-ball.ghost-done { transform: rotate(180deg); }
      #ghost-ring { opacity: 0; transform-origin: 50% 50%; }
      #cap-ball.ghost-done #ghost-ring { opacity: 1; animation: gp-ring 2.2s ease-in-out infinite; }
      @keyframes gp-ring {
        0%, 100% { transform: scale(.96); opacity: .6; }
        50%      { transform: scale(1.04); opacity: 1; }
      }
      #ghost-heart { opacity: 0; transform-box: fill-box; transform-origin: center; }
      #cap-ball.ghost-done #ghost-heart { opacity: 1; animation: gp-heart 1.4s ease-in-out infinite; }
      @keyframes gp-heart {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.15); }
      }
    </style>
  </head>

    <script>
      // ---- v0.122：引导教程侧栏聚焦协议 ----
      // 主窗 tour 章节2 步骤3 经 Python evaluate_js 调本窗函数做真实跨窗聚焦：
      //   __tourPanel.highlight(sel)  画呼吸高亮框（复用 styles 的 tour-breathe）
      //   __tourPanel.guide(sel,text) 高亮目标容器 + 弹一张引导卡（text 说明）
      //   __tourPanel.demo(type)      跑演示动画（"ripple"/"req-in"/"flow"）
      //   __tourPanel.clear()         移除高亮 + 演示 + 引导卡
      // pywebview（非 Electron）下 evaluate_js 不可用 → 这些函数静默 no-op。
      window.__tourPanel = (function () {
        var hl = null, demoRow = null, guideEl = null;
        function ensureHl() {
          if (!hl) {
            hl = document.createElement("div");
            hl.id = "__tour-panel-hl";
            hl.style.cssText =
              "position:fixed;pointer-events:none;z-index:99999;display:none;" +
              "border:2px solid var(--accent,#4f7cff);border-radius:8px;" +
              "box-shadow:0 0 0 4px rgba(79,124,255,.22), 0 0 20px 4px rgba(79,124,255,.40);" +
              // v0.209：与指引卡同步 transition（top/left/width/height）——
              // 否则卡平滑移动、高亮瞬间到位，视觉上卡追着高亮跑（错位）。
              "transition:top .45s ease,left .45s ease,width .45s ease,height .45s ease;" +
              // ⚠ 不能用 tour-breathe（主窗 spotlight 动画）—— 其 box-shadow
              // 0 0 0 9999px 会把高亮框投成**全屏灰色聚焦层**盖住整个侧栏。
              "animation:__tour-hl-breathe 1.9s ease-in-out infinite;";
            document.body.appendChild(hl);
          }
          return hl;
        }
        // v0.208：高亮框定位 —— 目标贴窗口边时 clamp 进窗口内，保证 2px 描边
        // 完整可见（否则球帽在角落时上/右边的高亮线被窗口裁掉）。
        function positionHl(r) {
          var h2 = ensureHl();
          h2.style.display = "block";
          var vw = window.innerWidth || 0, vh = window.innerHeight || 0;
          var pad = 3;
          var l = Math.max(0, r.left - pad);
          var t = Math.max(0, r.top - pad);
          var w = r.width + pad * 2;
          var h = r.height + pad * 2;
          if (l + w > vw) w = Math.max(pad * 2, vw - l);
          if (t + h > vh) h = Math.max(pad * 2, vh - t);
          h2.style.left = l + "px";
          h2.style.top = t + "px";
          h2.style.width = w + "px";
          h2.style.height = h + "px";
          return h2;
        }
        function highlight(sel) {
          var target = sel && document.querySelector(sel);
          var el = ensureHl();
          if (!target) { el.style.display = "none"; return { ok: false }; }
          var r = target.getBoundingClientRect();
          positionHl(r);
          return { ok: true };
        }
        // 引导卡：**裸悬浮**在目标容器左侧，指向目标，带说明文字。
        // 无背景、无边框 —— 纯文字 + 一根箭头，直接浮在侧栏窗口里目标
        // 元素左侧（下方透出侧栏原本内容）。主窗口完全不参与。
        // ⚠ 可读性：不能靠 accent 色（浅色主题下 accent 蓝在白底上太浅、
        // 且与面板同色系看不出）—— 用主文字色（--text-primary，浅主题黑 /
        // 深主题白），配一层相反色晕影，保证无背景裸文字在两种主题都清晰。
        // 引导卡：v0.208 起 = 主窗口 #tour-bubble 同款引导气泡卡片，渲染在
        // 侧栏窗口左侧指引带区，指向目标。结构（章节标题 / 步骤标题 / 正文）
        // 与主窗一致；样式：白/深面板底 + hairline 边框 + 14px 圆角 + 柔和
        // 投影 + 内边距，指针不拦截（pointer-events:none）不挡侧栏内容。
        function ensureGuide() {
          if (!guideEl) {
            guideEl = document.createElement("div");
            guideEl.id = "__tour-panel-guide";
            guideEl.className = "__tour-panel-guide-card";
            guideEl.style.cssText =
              "position:fixed;pointer-events:none;z-index:99999;display:none;" +
              "width:280px;" +
              "background:var(--panel-bg,#fff);color:var(--text-primary,#0a0a0a);" +
              "border:1px solid var(--hairline,rgba(0,0,0,.08));border-radius:14px;" +
              "box-shadow:0 24px 60px rgba(0,0,0,.40);transition:top .45s ease;" +
              "padding:14px 18px 12px;" +
              "font-family:'Microsoft YaHei','Microsoft YaHei UI','PingFang SC',sans-serif;";
            guideEl.innerHTML =
              '<div class="tp-gc-chapter"></div>' +
              '<div class="tp-gc-title"></div>' +
              '<div class="tp-gc-body"></div>';
            // 章节标题（accent 小字，同主窗 .tour-chapter-title）
            var chp = guideEl.firstElementChild;
            chp.style.cssText = "font-size:11px;font-weight:700;color:var(--accent,#4f7cff);" +
              "letter-spacing:.02em;margin-bottom:2px;";
            // 步骤标题（15px 600，同主窗 .tour-title）
            var ttl = chp.nextElementSibling;
            ttl.style.cssText = "font-size:15px;font-weight:600;color:var(--text-primary,#0a0a0a);" +
              "margin-bottom:6px;line-height:1.35;";
            // 正文（12.5px 600，同主窗 .tour-body）
            var bdy = ttl.nextElementSibling;
            bdy.style.cssText = "font-size:12.5px;line-height:1.55;color:var(--text-primary,#0a0a0a);" +
              "font-weight:600;";
            document.body.appendChild(guideEl);
          }
          return guideEl;
        }
        // guide(sel, text, extra)：extra = JSON 串 {chapter,title,body} 时按
        // 主窗气泡卡结构渲染；否则 text 全文放进正文区做兼容回退（探针直接
        // 调 guide(sel, "文字") 也能显示）。
        function guide(sel, text, extra) {
          var target = sel && document.querySelector(sel);
          var g = ensureGuide();
          if (!target) { g.style.display = "none"; return { ok: false }; }
          var card = {};
          try { if (extra) card = JSON.parse(extra) || {}; } catch (e) { card = {}; }
          var chp = g.children[0], ttl = g.children[1], bdy = g.children[2];
          if (card.chapter || card.title) {
            if (chp) chp.textContent = card.chapter || "";
            if (ttl) ttl.textContent = card.title || "";
            if (bdy) bdy.textContent = card.body || text || "";
          } else {
            if (bdy) bdy.textContent = String(text);
          }
          g.style.display = "block";
          var r = target.getBoundingClientRect();
          // 悬浮在目标左侧：卡片**右缘对齐**目标左缘（留 4px 缝隙给箭头），
          // 垂直居中于目标。先量文字实际宽，再把整卡往左排 —— 卡片主体落在
          // 目标左边的指引带空白区，不盖住目标；箭头正对目标。
          var gt = Math.max(6, r.top + r.height / 2 - 22);
          var vh = window.innerHeight || 0;
          if (gt + 80 > vh) gt = Math.max(6, vh - 80);
          g.style.top = gt + "px";
          var gw = g.offsetWidth || 0;   // display:block 后实测卡宽
          g.style.left = Math.max(6, r.left - 4 - gw) + "px";
          // 高亮目标（与 guide 共用呼吸框）—— demo("flow") 清过 hl，这里
          // 必须重新 ensureHl()，否则后续 guide 不再画高亮。
          positionHl(r);
          return { ok: true };
        }
        function demo(type) {
          var list = document.getElementById("lp-ep-list");
          if (type === "ripple" && list && !demoRow) {
            demoRow = document.createElement("div");
            demoRow.className = "tour-demo-ripple";
            demoRow.style.margin = "4px 0";
            demoRow.innerHTML = "<span>tour-demo</span> · anthropic";
            list.prepend(demoRow);
            highlight && highlight("#lp-ep-list");
          }

        window.ballDrag.end();
      });

      // ---- v0.184：展开态顶栏拖拽区 —— 拖整个容器窗口；X 按钮不触发。----
      (function () {
        var region = document.getElementById("panel-drag-region");
        if (!region) return;
        var dragging = false;
        region.addEventListener("mousedown", function (e) {
          if (e.target && e.target.id === "panel-btn-close") return; // X 不拖
          dragging = true;
          window.ballDrag.start("panel");
        });
        document.addEventListener("mouseup", function () {
          if (!dragging) return;
          dragging = false;
          window.ballDrag.end();
        });
        document.addEventListener("mouseleave", function () {
          if (!dragging) return;
          dragging = false;
          window.ballDrag.end();
        });
      })();

      // ---- v0.184：X 按钮 → 收起容器（uplink → Api.panel_close → pool 收起/隐藏）。----
      (function () {
        var btn = document.getElementById("panel-btn-close");
        if (!btn) return;
        btn.addEventListener("click", function () {
          if (window.pywebview && window.pywebview.api && window.pywebview.api.panel_close) {
            window.pywebview.api.panel_close();
          }
        });
      })();

      // ---- v0.184：磁吸模式（关球）隐藏球帽，side surface 占满；球模式恢复。----
      window.ghostSetBallVisible = function (on) {
        document.body.classList.toggle("no-ball", !on);
      };
    </script>
